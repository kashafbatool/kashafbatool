<svg viewBox="0 0 720 424" width="720" height="424" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
  <style>
    .cmd { clip-path: inset(0 100% 0 0); animation-name: type; animation-fill-mode: forwards; }
    .out { opacity: 0; animation: fade 0.25s ease forwards; }
    @keyframes type { to { clip-path: inset(0 -2% 0 0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .c1 { animation-duration: 0.7s; animation-delay: 0.6s; animation-timing-function: steps(8, end); }
    .o1 { animation-delay: 1.5s; }
    .c2 { animation-duration: 1.2s; animation-delay: 2.3s; animation-timing-function: steps(19, end); }
    .o2 { animation-delay: 3.7s; }
    .c3 { animation-duration: 1.6s; animation-delay: 4.5s; animation-timing-function: steps(27, end); }
    .o3a { animation-delay: 6.3s; }
    .o3b { animation-delay: 6.55s; }
    .c4 { animation-duration: 0.9s; animation-delay: 7.4s; animation-timing-function: steps(13, end); }
    .o4 { animation-delay: 8.5s; }
    .o5 { animation-delay: 9.3s; }
    .cursor { opacity: 0; animation: blink 1.1s steps(1, end) 9.5s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cmd { clip-path: none; animation: none; }
      .out { opacity: 1; animation: none; }
      .cursor { opacity: 1; animation: none; }
    }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="718" height="422" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- title bar -->
  <path d="M1 13 A12 12 0 0 1 13 1 H707 A12 12 0 0 1 719 13 V44 H1 Z" fill="#161b22"/>
  <line x1="1" y1="44" x2="719" y2="44" stroke="#30363d" stroke-width="1"/>
  <circle cx="26" cy="23" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="23" r="6.5" fill="#28c840"/>
  <text x="360" y="28" text-anchor="middle" fill="#8b949e" font-size="13">kashaf@github: ~</text>

  <!-- $ whoami -->
  <text class="cmd c1" x="28" y="84"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  <text class="out o1" x="28" y="112" fill="#e6edf3">kashaf batool</text>

  <!-- $ cat interests.txt -->
  <text class="cmd c2" x="28" y="154"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cat interests.txt</tspan></text>
  <text class="out o2" x="28" y="182" fill="#e6edf3">AI &#183; robotics &#183; cloud architecture &#183; embedded &#183; NLP</text>

  <!-- $ ps aux | grep internships -->
  <text class="cmd c3" x="28" y="224"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">ps aux | grep internships</tspan></text>
  <text class="out o3a" x="28" y="252" fill="#79c0ff">pulse&#160;&#160;&#160;&#160;running&#160;&#160;&#160;&#160;pytest + CI</text>
  <text class="out o3b" x="28" y="278" fill="#79c0ff">phs&#160;&#160;&#160;&#160;&#160;&#160;running&#160;&#160;&#160;&#160;cms-migration</text>

  <!-- $ echo $MOTTO -->
  <text class="cmd c4" x="28" y="320"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">echo $MOTTO</tspan></text>
  <text class="out o4" x="28" y="348" fill="#d2a8ff">theory &#8594; code &#8594; impact</text>

  <!-- final prompt + blinking cursor -->
  <text class="out o5" x="28" y="392" fill="#7ee787">$</text>
  <rect class="cursor" x="48" y="379" width="9" height="17" fill="#e6edf3"/>
</svg>
